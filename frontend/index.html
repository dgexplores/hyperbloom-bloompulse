THESIS: A machine's condition is a continuous inked trace on gridded chart
paper, annotated where the event happened. Refuses the telemetry dashboard's
grid of glowing stat tiles on near-black.
OWN-WORLD: Multi-pen strip-chart recorder. Warm chart stock, printed
orange-red grid, three recorder pens (red vibration, green temperature, blue
pressure), pre-printed ISO limit lines, condensed grotesque chart furniture in
letterspaced caps, hairline rules, tabular figures. Paper, not screen.
STORY: A maintenance supervisor loads a CSV, watches the pens draw the machine's
recent life, sees the trace cross a printed limit, and reads the verdict and the
standard that sets that limit in the margin beside it.
FIRST VIEWPORT: Chart header block across the top (instrument name, chart no.,
corpus version, pen range card). Below it the full-width chart, pre-printed and
blank, limit lines and zone bands already on the paper. The load control is a
ruled form field on the chart header. Primary action sits in the header, right.
