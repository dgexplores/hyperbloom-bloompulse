services:
  backend:
    # No Dockerfile: run the FastAPI app directly off the repo checkout so
    # the compose path and the Vercel path score with the same code.
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      # Only what the app actually reads. It used to also set LLM_PROVIDER and
      # VECTOR_STORE, which nothing has ever read.
      - PYTHONPATH=/app
      - APP_ENV=development
      # No proxy in front of this container, so the limiter keys on the socket.
      - TRUSTED_PROXY_HOPS=0
    command: sh -c "pip install -q -r requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
